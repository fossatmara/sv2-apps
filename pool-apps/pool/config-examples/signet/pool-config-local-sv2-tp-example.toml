# SRI Pool config
authority_public_key = "9auqWEzQDVyd2oe1JVGFLMLHZtCo2FFqZwtKA5gd9xbuEu7PH72"
authority_secret_key = "mkDLTBBRxdBv998612qipDYoTK3YUrqLe8uWw7gu3iXbSrn2n"
cert_validity_sec = 3600
listen_address = "0.0.0.0:33333"

# Coinbase outputs are specified as descriptors. A full list of descriptors is available at
#     https://github.com/bitcoin/bips/blob/master/bip-0380.mediawiki#appendix-b-index-of-script-expressions
# Although the `musig` descriptor is not yet supported and the legacy `combo` descriptor never
# will be. If you have an address, embed it in a descriptor like `addr(<address here>)`.
coinbase_reward_script = "addr(tb1qa0sm0hxzj0x25rh8gw5xlzwlsfvvyz8u96w3p8)"

# Server Id (number to guarantee unique search space allocation across different Pool servers)
server_id = 1

# Pool signature (string to be included in coinbase tx)
pool_signature = "Stratum V2 SRI Pool"

# Enable this option to set a predefined log file path.
# When enabled, logs will always be written to this file.
# The CLI option --log-file (or -f) will override this setting if provided.
# log_file = "./pool.log"

# How many shares we expect to receive in a minute (determines difficulty targets)
shares_per_minute = 6.0

# Accept every submitted share without validation (TESTING ONLY).
# Enables simulated miners that exercise vardiff without real hashing.
# ignore_share_validation = true
# How many shares do we want to acknowledge in a batch
share_batch_size = 10

monitoring_address = "127.0.0.1:9090"
monitoring_cache_refresh_secs = 15

# Local Sv2 Template Provider config
[template_provider_type.Sv2Tp]
# address accepts "ip:port" or "hostname:port" (e.g. "tp.example.com:8442")
address = "127.0.0.1:38442"

# Note: Embedded JDS ([jds] section) is NOT available with Sv2Tp template provider.
# JDS requires template_provider_type = BitcoinCoreIpc for direct IPC access to Bitcoin Core.

# Vardiff algorithm selection and tuning. Defaults to the classic
# threshold controller; "pid" is a log-space PID controller.
# [vardiff]
# algorithm = "pid"   # "classic" (default), "pid", or "qpid" (PID + Q-learning gains)
# kp = 0.6            # proportional gain on log-space rate error
# ki = 0.005          # integral gain per second
# kd = 0.0            # derivative gain (off by default)
# max_step = 8.0      # largest multiplicative difficulty change per update
# deadband = 0.1      # I-term pressure needed to emit without a significant window
# significance_z = 3.0 # single-window statistical significance gate (sigmas)
# significance_z_down = 1.5 # lower bar for downward corrections (capped at significance_z)
# alpha = 0.15         # qpid: Q-learning rate
# gamma = 0.7          # qpid: discount factor
# epsilon = 0.1        # qpid: exploration rate
