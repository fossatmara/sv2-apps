<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vardiff-sim</title>
<link rel="stylesheet" href="/assets/uplot.css">
<script src="/assets/uplot.js"></script>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 1rem; background: #0d1117; color: #c9d1d9;
         font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  h1 { font-size: 1.05rem; margin: 0 0 .75rem; color: #58a6ff; }
  h1 small { color: #8b949e; font-weight: normal; }
  table { border-collapse: collapse; width: 100%; margin-bottom: 1rem; }
  th, td { padding: .3rem .6rem; text-align: right; border-bottom: 1px solid #21262d; }
  th { color: #8b949e; font-weight: normal; }
  th:first-child, td:first-child { text-align: left; }
  tr.sel { background: #161b22; }
  tr.down td { color: #f85149; }
  tbody tr { cursor: pointer; }
  button { background: #21262d; color: #c9d1d9; border: 1px solid #30363d;
           border-radius: 4px; padding: .1rem .45rem; margin-left: .2rem; cursor: pointer; }
  button:hover { border-color: #58a6ff; }
  button.on { border-color: #3fb950; color: #3fb950; }
  .bar { display: flex; gap: .75rem; align-items: center; margin-bottom: .75rem; flex-wrap: wrap; }
  input { background: #010409; color: #c9d1d9; border: 1px solid #30363d;
          border-radius: 4px; padding: .15rem .4rem; width: 8rem; }
  #chartwrap { background: #010409; border: 1px solid #21262d; border-radius: 6px;
               padding: .5rem; }
  .u-legend { color: #c9d1d9; font: 12px ui-monospace, monospace; }
  .u-legend .u-marker { border-radius: 50%; }
  .hint { color: #8b949e; font-size: 12px; margin-top: .25rem; }
</style>
</head>
<body>
<h1>vardiff-sim <small id="meta">connecting…</small></h1>

<div class="bar" id="speedbar" style="display:none">
  speed: <b id="speed">1</b>x
  <button onclick="setSpeed(0.5)">÷2</button>
  <button onclick="setSpeed(2)">×2</button>
  <span style="width:1.5rem"></span>
  confidence K: <b id="confk">2</b>
  <button onclick="setConfK(0.5)">÷2</button>
  <button onclick="setConfK(2)">×2</button>
  <span style="width:1.5rem"></span>
  Z↑: <b id="sigz">2</b>σ
  <button onclick="setSigZ(-0.5)">−.5</button>
  <button onclick="setSigZ(0.5)">+.5</button>
  <span style="width:1rem"></span>
  Z↓: <b id="sigzd">1.5</b>σ
  <button onclick="setSigZDown(-0.5)">−.5</button>
  <button onclick="setSigZDown(0.5)">+.5</button>
</div>

<table id="miners">
  <thead><tr>
    <th>miner</th><th>status</th><th>hashrate</th><th>difficulty</th>
    <th>exp/min</th><th>real/min</th><th>sub</th><th>acc</th><th>rej</th>
    <th>vardiff</th><th>actions</th>
  </tr></thead>
  <tbody></tbody>
</table>

<div class="bar">
  <input id="addname" placeholder="name (optional)">
  <input id="addhash" placeholder="hashrate H/s" value="100e12">
  <button onclick="addMiner()">add miner</button>
  <span style="flex:1"></span>
  <button id="full" onclick="toggleFull()">full history</button>
  <button id="live" class="on" onclick="toggleLive()">live</button>
</div>

<div id="chartwrap"><div id="chart"></div></div>
<div class="hint">hover for values · drag to zoom (pauses live) · double-click to reset zoom</div>

<script>
const TOKEN = new URLSearchParams(location.search).get('token') || '';
const AUTH = { 'authorization': 'Bearer ' + TOKEN };
let selected = null;
let last = null;
let live = true;
let chart = null;
let chartMiner = null;
let changes = [];   // hashrate changes of the selected miner, for the draw hook

function fmtHash(h) {
  const u = [[1e15,'PH/s'],[1e12,'TH/s'],[1e9,'GH/s'],[1e6,'MH/s'],[1e3,'kH/s']];
  for (const [s, n] of u) if (h >= s) return (h/s).toFixed(2) + ' ' + n;
  return h.toFixed(0) + ' H/s';
}

async function post(path, body) {
  await fetch(path, {method:'POST',
                     headers: {...AUTH, 'content-type':'application/json'},
                     body: body ? JSON.stringify(body) : '{}'});
}
function setSpeed(mul) { if (last) post('/api/speed', {speed: last.speed * mul}); }
function setConfK(mul) {
  if (last) post('/api/confidence', {k: Math.max(0.25, last.confidence_k * mul)});
}
function setSigZ(delta) {
  if (last) post('/api/significance', {z: Math.max(0.5, last.significance_z + delta)});
}
function setSigZDown(delta) {
  if (last) post('/api/significance', {z: Math.max(0.5, last.significance_z_down + delta), down: true});
}
function scale(name, mul) {
  const m = last.miners.find(m => m.name === name);
  if (m) post(`/api/miners/${encodeURIComponent(name)}/hashrate`, {hashrate: m.hashrate * mul});
}
function act(name, action) { post(`/api/miners/${encodeURIComponent(name)}/${action}`); }
function addMiner() {
  const name = document.getElementById('addname').value.trim() || undefined;
  const hashrate = parseFloat(document.getElementById('addhash').value) || undefined;
  post('/api/miners', {name, hashrate});
}
function toggleLive() {
  live = !live;
  document.getElementById('live').classList.toggle('on', live);
  if (live && last) refreshChart();
}

let fullMode = false;
let fullTimer = null;
let lastFull = null;
async function fetchFull() {
  try {
    const r = await fetch('/api/stats?full=1', {headers: AUTH});
    if (r.ok) {
      lastFull = await r.json();
      if (live) updateChart(lastFull, true);
    }
  } catch (e) {}
}
function toggleFull() {
  fullMode = !fullMode;
  document.getElementById('full').classList.toggle('on', fullMode);
  chartMiner = null; // force chart rebuild for the new x-range
  if (fullMode) {
    fetchFull();
    fullTimer = setInterval(fetchFull, 3000);
  } else {
    clearInterval(fullTimer);
    fullTimer = null;
    if (last) refreshChart();
  }
}
/// Chart from the right source for the current mode.
function refreshChart() {
  if (fullMode) {
    if (lastFull) updateChart(lastFull, true);
  } else if (last) {
    updateChart(last, false);
  }
}

function render(data) {
  last = data;
  document.getElementById('meta').textContent =
    `t=${data.elapsed_secs.toFixed(0)}s | ${data.miners.length} miners | window ${data.window_secs}s`;
  const sb = document.getElementById('speedbar');
  sb.style.display = data.speed_control ? 'flex' : 'none';
  document.getElementById('speed').textContent = data.speed.toFixed(2);
  document.getElementById('confk').textContent = data.confidence_k.toFixed(2);
  document.getElementById('sigz').textContent = data.significance_z.toFixed(1);
  document.getElementById('sigzd').textContent = data.significance_z_down.toFixed(1);

  if (!selected && data.miners.length) selected = data.miners[0].name;
  const tb = document.querySelector('#miners tbody');
  tb.innerHTML = '';
  for (const m of data.miners) {
    const tr = document.createElement('tr');
    if (m.name === selected) tr.classList.add('sel');
    if (!m.connected) tr.classList.add('down');
    tr.onclick = () => { selected = m.name; chartMiner = null; render(last); refreshChart(); };
    tr.innerHTML = `<td>${m.name}</td><td>${m.connected ? 'up' : 'down'}</td>` +
      `<td>${fmtHash(m.hashrate)}</td><td>${m.difficulty.toFixed(2)}</td>` +
      `<td>${m.expected_spm.toFixed(2)}</td><td>${m.realized_spm.toFixed(2)}</td>` +
      `<td>${m.submitted}</td><td>${m.accepted}</td><td>${m.rejected}</td>` +
      `<td>${m.target_updates}</td>` +
      `<td><button onclick="event.stopPropagation();scale('${m.name}',0.5)">½×</button>` +
      `<button onclick="event.stopPropagation();scale('${m.name}',2)">2×</button>` +
      `<button onclick="event.stopPropagation();act('${m.name}','${m.connected ? 'disconnect' : 'reconnect'}')">${m.connected ? 'disc' : 'reconn'}</button>` +
      `<button onclick="event.stopPropagation();act('${m.name}','remove')">✕</button></td>`;
    tb.appendChild(tr);
  }
  if (live && !fullMode) updateChart(data, false);
}

// Merge the event-based series onto one x axis (uPlot needs aligned arrays).
function buildData(m, x2, hasSynthetic) {
  const hist = m.difficulty_history;
  if (!hist.length) return null;
  const gainHist = m.gain_changes || [];
  const xs = new Set();
  hist.forEach(([t]) => xs.add(t));
  m.shares.forEach(t => xs.add(t));
  gainHist.forEach(([t]) => xs.add(t));
  xs.add(x2);
  const x = [...xs].sort((a, b) => a - b);
  const idx = new Map(x.map((v, i) => [v, i]));
  const diff = Array(x.length).fill(null);
  hist.forEach(([t, d]) => { diff[idx.get(t)] = d; });
  diff[idx.get(x2)] = hist.at(-1)[1];
  const fire = Array(x.length).fill(null);
  // Every real history point is a vardiff firing; once the window has slid
  // past the origin, index 0 is the synthetic held entry point, not a fire.
  hist.forEach(([t, d], i) => { if (!(i === 0 && hasSynthetic)) fire[idx.get(t)] = d; });
  const rug = Array(x.length).fill(null);
  m.shares.forEach(t => { rug[idx.get(t)] = 0.5; });
  // Controller gains (read-only telemetry): stepped lines on their own
  // scale; ki is upscaled 100x to share an axis with kp/kd.
  const gkp = Array(x.length).fill(null);
  const gki = Array(x.length).fill(null);
  const gkd = Array(x.length).fill(null);
  gainHist.forEach(([t, kp, ki, kd]) => {
    const i = idx.get(t);
    gkp[i] = kp; gki[i] = ki * 100; gkd[i] = kd;
  });
  if (gainHist.length) {
    const [, kp, ki, kd] = gainHist.at(-1);
    const i = idx.get(x2);
    gkp[i] = kp; gki[i] = ki * 100; gkd[i] = kd;
  }
  return [x, diff, fire, rug, gkp, gki, gkd];
}

function drawChangeLines(u) {
  const ctx = u.ctx;
  ctx.save();
  ctx.lineWidth = 1.5;
  for (const [t, from, to] of changes) {
    const x = u.valToPos(t, 'x', true);
    if (x < u.bbox.left || x > u.bbox.left + u.bbox.width) continue;
    ctx.strokeStyle = to >= from ? '#3fb950' : '#f85149';
    ctx.beginPath();
    ctx.moveTo(x, u.bbox.top);
    ctx.lineTo(x, u.bbox.top + u.bbox.height);
    ctx.stroke();
  }
  ctx.restore();
}

function makeChart(data) {
  const el = document.getElementById('chart');
  el.innerHTML = '';
  const opts = {
    width: el.parentElement.clientWidth - 16,
    height: 320,
    scales: { x: { time: false }, y: {}, r: { range: [0, 12] }, g: {} },
    series: [
      { label: 't', value: (u, v) => v == null ? '' : v.toFixed(1) + 's' },
      { label: 'difficulty', stroke: '#39c5cf', width: 2, spanGaps: true,
        paths: uPlot.paths.stepped({align: 1}), points: {show: false},
        value: (u, v) => v == null ? '—' : v.toFixed(2) },
      { label: 'vardiff fired', stroke: '#d2a8ff', paths: () => null,
        points: {show: true, size: 8, fill: '#d2a8ff'},
        value: (u, v) => v == null ? '—' : 'diff → ' + v.toFixed(2) },
      { label: 'share', scale: 'r', stroke: '#6e7681', paths: () => null,
        points: {show: true, size: 4, fill: '#6e7681'},
        value: (u, v) => v == null ? '—' : '●' },
      { label: 'kp', scale: 'g', stroke: '#e3b341', width: 1, spanGaps: true,
        paths: uPlot.paths.stepped({align: 1}), points: {show: false},
        value: (u, v) => v == null ? '—' : v.toFixed(3) },
      { label: 'ki×100', scale: 'g', stroke: '#bc8cff', width: 1, spanGaps: true,
        paths: uPlot.paths.stepped({align: 1}), points: {show: false},
        value: (u, v) => v == null ? '—' : (v / 100).toFixed(4) },
      { label: 'kd', scale: 'g', stroke: '#f778ba', width: 1, spanGaps: true,
        paths: uPlot.paths.stepped({align: 1}), points: {show: false},
        value: (u, v) => v == null ? '—' : v.toFixed(3) },
    ],
    axes: [
      { stroke: '#8b949e', grid: {stroke: '#21262d'}, ticks: {stroke: '#21262d'},
        values: (u, vals) => vals.map(v => v.toFixed(0) + 's') },
      { stroke: '#8b949e', grid: {stroke: '#21262d'}, ticks: {stroke: '#21262d'}, size: 76 },
      { scale: 'g', side: 1, stroke: '#8b949e', grid: {show: false},
        ticks: {stroke: '#21262d'}, size: 50 },
    ],
    cursor: { drag: { x: true, y: false } },
    hooks: {
      draw: [drawChangeLines],
      setSelect: [u => { if (u.select.width > 0 && live) toggleLive(); }],
    },
  };
  chart = new uPlot(opts, data, el);
}

function updateChart(data, full) {
  const m = data.miners.find(m => m.name === selected);
  if (!m) return;
  const hasSynthetic = !full && data.elapsed_secs > data.window_secs;
  const d = buildData(m, data.elapsed_secs, hasSynthetic);
  if (!d) return;
  changes = m.hashrate_changes;
  if (!chart || chartMiner !== selected) {
    chartMiner = selected;
    makeChart(d);
  } else {
    chart.setData(d);
  }
}

window.addEventListener('resize', () => {
  if (chart) chart.setSize({width: document.getElementById('chartwrap').clientWidth - 16, height: 320});
});

// Server pushes snapshots over a WebSocket (event-driven, ~100ms after any
// change, 1s heartbeat); the browser never polls. Reconnects with backoff.
let retryMs = 1000;
function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(`${proto}://${location.host}/api/ws?token=${encodeURIComponent(TOKEN)}`);
  ws.onmessage = ev => { retryMs = 1000; render(JSON.parse(ev.data)); };
  ws.onclose = ev => {
    document.getElementById('meta').textContent = ev.code === 1008 || ev.code === 1002
      ? 'unauthorized — open the URL printed by vardiff-sim (includes ?token=)'
      : `disconnected — retrying in ${(retryMs/1000).toFixed(0)}s`;
    setTimeout(connect, retryMs);
    retryMs = Math.min(retryMs * 2, 10000);
  };
  ws.onerror = () => ws.close();
}
connect();
</script>
</body>
</html>
