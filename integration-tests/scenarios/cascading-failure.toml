# Cascading hardware failure — a fleet dying one unit at a time.
#
# Failure mode: a bad batch of PSUs (or a failing cooling loop) takes units
# offline in sequence, ~90s apart, and they do NOT come back. Some die cleanly
# (disconnect); others degrade first (hashrate collapses to a trickle) before
# dropping — the "limping ASIC" that keeps a channel open while producing
# almost nothing.
#
# Watch: per-channel independence. Each death is uncorrelated in time, so the
# controller must retarget the dying/degrading unit downward without disturbing
# the survivors. The degrade-then-drop units test the idle backstop and the
# loosening path on a channel that goes near-silent but stays connected.
name = "cascading-failure"
duration_secs = 900

# Clean death.
[[miners]]
name = "unit-1"
hashrate = 120e12
[[miners.events]]
at = 120
action = "disconnect"

# Degrade to a trickle, then drop.
[[miners]]
name = "unit-2"
hashrate = 120e12
[[miners.events]]
at = 210
action = "set_hashrate"
hashrate = 6e12
[[miners.events]]
at = 330
action = "disconnect"

# Slow degrade in two stages (thermal runaway), stays connected limping.
[[miners]]
name = "unit-3"
hashrate = 200e12
[[miners.events]]
at = 300
action = "set_hashrate"
hashrate = 60e12
[[miners.events]]
at = 480
action = "set_hashrate"
hashrate = 8e12

# Clean death late in the run.
[[miners]]
name = "unit-4"
hashrate = 150e12
[[miners.events]]
at = 600
action = "disconnect"

# Survivor: healthy throughout. Should stay converged while peers die around it.
[[miners]]
name = "survivor"
hashrate = 100e12
