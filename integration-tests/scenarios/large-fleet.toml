# Large fleet — 100 miners on one pool: breadth stress, not shape.
#
# Failure mode class distinct from every other scenario (all <=6 miners):
# this exercises the SHARED qpid Q-table under real fleet pressure, per-
# channel vardiff state at scale, and lock/map contention in the pool's
# share path. A realistic size distribution (many small, few large) spanning
# ~200x, with a slice churning and a slice drifting so the fleet is never
# quiescent. Generated deterministically (seed 2188).
#
# Watch: does per-channel difficulty stay independent across 100 channels,
# and does the shared Q-table converge to a sane policy under this load
# rather than thrashing between many miners' conflicting states?
name = "large-fleet"
duration_secs = 900

